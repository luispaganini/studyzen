services:
  postgres:
    image: postgres:17-alpine
    container_name: studyzen-postgres
    environment:
      POSTGRES_DB: studyzen
      POSTGRES_USER: studyzen
      POSTGRES_PASSWORD: studyzen
    ports:
      - "5432:5432"
    volumes:
      - studyzen-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyzen"]
      interval: 5s
      retries: 10

volumes:
  studyzen-data:
